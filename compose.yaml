services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: karsift_autodev
      POSTGRES_USER: karsift
      POSTGRES_PASSWORD: karsift
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karsift -d karsift_autodev"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

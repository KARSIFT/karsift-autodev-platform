name: ADP-017 Proposal Diagnostics

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  proposal-diagnostics:
    if: github.head_ref == 'change/ADP-017-structured-builder-proposals'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: autodev
          POSTGRES_USER: autodev
          POSTGRES_PASSWORD: autodev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autodev -d autodev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://autodev:autodev@127.0.0.1:5432/autodev
      INTERNAL_API_TOKEN: ci-internal-token-not-for-production
      FOUNDER_API_TOKEN: ci-founder-token-not-for-production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run migrate
      - name: Capture proposal lifecycle output
        id: proposal
        run: |
          set -o pipefail
          npm run verify:builder-proposal 2>&1 | tee adp017-proposal.log
      - name: Upload proposal diagnostics
        if: failure() && steps.proposal.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: adp017-proposal-lifecycle-diagnostics
          path: adp017-proposal.log
          retention-days: 1

name: ADP-013 Diagnostics

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install committed locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Capture deterministic check output
        id: check
        run: |
          set -o pipefail
          npm run check 2>&1 | tee adp013-check.log

      - name: Upload diagnostics
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: adp013-deterministic-check-diagnostics
          path: adp013-check.log
          retention-days: 1

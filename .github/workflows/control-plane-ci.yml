name: Control Plane CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Exact toolchain, deployment, and PostgreSQL validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: autodev
          POSTGRES_USER: autodev
          POSTGRES_PASSWORD: autodev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autodev -d autodev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://autodev:autodev@127.0.0.1:5432/autodev
      INTERNAL_API_TOKEN: ci-internal-token-not-for-production
      FOUNDER_API_TOKEN: ci-founder-token-not-for-production

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Record runtime versions
        run: |
          node --version
          npm --version

      - name: Install committed locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run deterministic TypeScript and unit checks
        run: npm run check

      - name: Validate development Compose configuration
        env:
          CONTROL_PLANE_DOMAIN: control.example.test
          POSTGRES_DB: autodev
          POSTGRES_USER: autodev
          POSTGRES_PASSWORD: ci-only-password
          DATABASE_URL: postgresql://autodev:ci-only-password@postgres:5432/autodev
          CONTROL_PLANE_API_TOKEN: ci-internal-token-not-for-production-0001
          CONTROL_PLANE_FOUNDER_API_TOKEN: ci-founder-token-not-for-production-0002
          CONTROL_PLANE_FOUNDER_INTERFACE_API_TOKEN: ci-interface-token-not-for-production-0003
        run: docker compose -f deploy/development/compose.yaml config >/dev/null

      - name: Build development Control Plane image
        run: docker build --target runtime -t karsift-autodev-control-plane:ci .

      - name: Apply PostgreSQL migration
        run: npm run migrate

      - name: Re-run migration to prove idempotency
        run: npm run migrate

      - name: Verify PostgreSQL foundation invariants
        run: npm run verify:postgres

      - name: Verify durable work queue and execution leases
        run: npm run verify:queue

      - name: Verify freshness and continuing authority
        run: npm run verify:freshness

      - name: Verify governed Change Contract authorization
        run: npm run verify:authorization

      - name: Verify AI Budget Governor and cost reservations
        run: npm run verify:budget

      - name: Verify execution evidence and Task Context Packs
        run: npm run verify:context-pack

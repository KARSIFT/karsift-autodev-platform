name: ADP-013 Verifier Fix

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'change/ADP-013-repository-workspaces'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Fix CI capability-toggle helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-repository-workspace.mjs')
          text = path.read_text()
          start = text.index('  async function setAutomatedWrite(enabled, reason) {')
          end = text.index('\n  async function createPreparedBuilder', start)
          replacement = '''  async function setAutomatedWrite(enabled, reason) {
    const updated = await pool.query(
      `UPDATE capability_switches
          SET enabled = $2,
              reason = $3,
              updated_by = 'ci',
              updated_at = now()
        WHERE scope_type = 'PROJECT'
          AND project_id = $1
          AND capability = 'AUTOMATED_WRITE'
        RETURNING id`,
      [projectId, enabled, reason],
    );
    if ((updated.rowCount ?? 0) === 0) {
      await pool.query(
        `INSERT INTO capability_switches(
           scope_type, project_id, capability, enabled, reason, updated_by
         ) VALUES ('PROJECT', $1, 'AUTOMATED_WRITE', $2, $3, 'ci')`,
        [projectId, enabled, reason],
      );
    }
  }
'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          rm -f .github/workflows/adp013-verifier-fix.yml
      - name: Commit exact verifier fix and remove this workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-repository-workspace.mjs .github/workflows/adp013-verifier-fix.yml
          git commit -m "ADP-013 fix workspace verifier capability toggle"
          git push origin HEAD:${{ github.head_ref }}

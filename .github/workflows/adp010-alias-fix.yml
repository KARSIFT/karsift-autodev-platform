name: ADP-010 Alias Fix

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'change/ADP-010-provider-dispatch-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Patch reserved SQL alias
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-provider-dispatch.mjs')
          text = path.read_text()
          text = text.replace('authorization.id AS authorization_id', 'auth_evidence.id AS authorization_id')
          text = text.replace(') authorization ON true', ') auth_evidence ON true')
          path.write_text(text)
          PY
      - name: Commit exact patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-provider-dispatch.mjs
          git commit -m "ADP-010 fix reserved provider verifier alias"
          git push origin HEAD:${{ github.head_ref }}

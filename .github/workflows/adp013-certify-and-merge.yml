name: ADP-013 Certified Bootstrap Merge

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  certify-and-merge:
    if: github.event.pull_request.number == 27 && github.head_ref == 'change/ADP-013-repository-workspaces'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: autodev
          POSTGRES_USER: autodev
          POSTGRES_PASSWORD: autodev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autodev -d autodev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://autodev:autodev@127.0.0.1:5432/autodev
      INTERNAL_API_TOKEN: ci-internal-token-not-for-production
      FOUNDER_API_TOKEN: ci-founder-token-not-for-production
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Refuse stale branch state
        run: |
          git fetch origin "${GITHUB_HEAD_REF}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/${GITHUB_HEAD_REF})"

      - name: Construct final clean tree
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          main = Path('src/main.ts')
          text = main.read_text()
          if 'attachRepositoryWorkspaceRoute' not in text:
              text = text.replace(
                  'import { attachProviderDispatchRoute } from "./http/provider-dispatch-route.js";\n',
                  'import { attachProviderDispatchRoute } from "./http/provider-dispatch-route.js";\n'
                  'import { attachRepositoryWorkspaceRoute } from "./http/repository-workspace-route.js";\n',
              )
          if 'createRepositoryWorkspaceRuntime' not in text:
              text = text.replace(
                  'import { attachTaskContextPackRoute } from "./http/task-context-pack-route.js";\n',
                  'import { attachTaskContextPackRoute } from "./http/task-context-pack-route.js";\n'
                  'import { createRepositoryWorkspaceRuntime } from "./repository/repository-workspace-runtime.js";\n',
              )
          if 'const repositoryWorkspaceRuntime = createRepositoryWorkspaceRuntime(pool);' not in text:
              text = text.replace(
                  'const server = createControlPlaneServer(config, store);\n',
                  'const repositoryWorkspaceRuntime = createRepositoryWorkspaceRuntime(pool);\n'
                  'const server = createControlPlaneServer(config, store);\n',
              )
          if 'repositoryWorkspaceRuntime.service' not in text:
              text = text.replace(
                  'attachBuilderRuntimeRoute(server, config, store, builderRuntimeService);\n',
                  'attachBuilderRuntimeRoute(server, config, store, builderRuntimeService);\n'
                  'attachRepositoryWorkspaceRoute(\n'
                  '  server,\n'
                  '  config,\n'
                  '  repositoryWorkspaceRuntime.store,\n'
                  '  repositoryWorkspaceRuntime.service,\n'
                  ');\n',
              )
          main.write_text(text)

          dockerfile = Path('Dockerfile')
          text = dockerfile.read_text()
          if 'apk add --no-cache git' not in text:
              marker = 'FROM node:24.18.0-alpine AS runtime\nENV NODE_ENV=production\nWORKDIR /app\n'
              replacement = marker + (
                  'RUN apk add --no-cache git \\\n'
                  '    && mkdir -p /var/lib/karsift/repositories /var/lib/karsift/workspaces \\\n'
                  '    && chown -R node:node /var/lib/karsift\n'
              )
              text = text.replace(marker, replacement)
          dockerfile.write_text(text)

          package = Path('package.json')
          data = json.loads(package.read_text())
          data['scripts']['verify:repository-workspace'] = 'node scripts/verify-repository-workspace.mjs'
          package.write_text(json.dumps(data, indent=2) + '\n')

          workflow = Path('.github/workflows/control-plane-ci.yml')
          text = workflow.read_text()
          if 'Verify isolated repository workspaces and scope enforcement' not in text:
              text = text.rstrip() + '''\n\n      - name: Verify isolated repository workspaces and scope enforcement\n        run: npm run verify:repository-workspace\n'''
          workflow.write_text(text)

          foundation = Path('scripts/verify-postgres-foundation.mjs')
          text = foundation.read_text()
          if '"repository_workspace_plans"' not in text:
              text = text.replace(
                  '    "projects",\n',
                  '    "projects",\n'
                  '    "repository_workspace_evidence",\n'
                  '    "repository_workspace_plans",\n'
                  '    "repository_workspaces",\n',
              )
          if '"0010_repository_workspaces.sql"' not in text:
              text = text.replace(
                  '      "0009_atomic_builder_dispatch.sql",\n',
                  '      "0009_atomic_builder_dispatch.sql",\n'
                  '      "0010_repository_workspaces.sql",\n',
              )
          foundation.write_text(text)

          verifier = Path('scripts/verify-repository-workspace.mjs')
          text = verifier.read_text()
          if 'ON CONFLICT (' in text and 'async function setAutomatedWrite' in text:
              start = text.index('  async function setAutomatedWrite(enabled, reason) {')
              end = text.index('\n  async function createPreparedBuilder', start)
              replacement = '''  async function setAutomatedWrite(enabled, reason) {
    const updated = await pool.query(
      `UPDATE capability_switches
          SET enabled = $2,
              reason = $3,
              updated_by = 'ci',
              updated_at = now()
        WHERE scope_type = 'PROJECT'
          AND project_id = $1
          AND capability = 'AUTOMATED_WRITE'
        RETURNING id`,
      [projectId, enabled, reason],
    );
    if ((updated.rowCount ?? 0) === 0) {
      await pool.query(
        `INSERT INTO capability_switches(
           scope_type, project_id, capability, enabled, reason, updated_by
         ) VALUES ('PROJECT', $1, 'AUTOMATED_WRITE', $2, $3, 'ci')`,
        [projectId, enabled, reason],
      );
    }
  }
'''
              text = text[:start] + replacement + text[end:]
          verifier.write_text(text)
          PY

          rm -f .github/workflows/adp013-*.yml

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install committed locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run deterministic TypeScript and unit checks on final tree
        run: npm run check

      - name: Validate development Compose configuration
        env:
          CONTROL_PLANE_DOMAIN: control.example.test
          POSTGRES_DB: autodev
          POSTGRES_USER: autodev
          POSTGRES_PASSWORD: ci-only-password
          DATABASE_URL: postgresql://autodev:ci-only-password@postgres:5432/autodev
          CONTROL_PLANE_API_TOKEN: ci-internal-token-not-for-production-0001
          CONTROL_PLANE_FOUNDER_API_TOKEN: ci-founder-token-not-for-production-0002
          CONTROL_PLANE_FOUNDER_INTERFACE_API_TOKEN: ci-interface-token-not-for-production-0003
        run: docker compose -f deploy/development/compose.yaml config >/dev/null

      - name: Build final runtime image
        run: docker build --target runtime -t karsift-autodev-control-plane:adp013-merge .

      - name: Apply all migrations and prove idempotency
        run: |
          npm run migrate
          npm run migrate

      - name: Run the full Control Plane lifecycle suite
        run: |
          npm run verify:postgres
          npm run verify:queue
          npm run verify:freshness
          npm run verify:authorization
          npm run verify:budget
          npm run verify:context-pack
          npm run verify:provider
          npm run verify:builder-runtime
          npm run verify:builder-dispatch
          npm run verify:repository-workspace

      - name: Commit exactly the certified clean tree
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "ADP-013 certify isolated repository workspace candidate"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Mark PR ready and squash merge the certified tree
        run: |
          gh pr ready "${{ github.event.pull_request.number }}" --repo "${GITHUB_REPOSITORY}" || true
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --squash \
            --subject "ADP-013 — Isolated Repository Workspace and Automated Write Gate"

      - name: Close completed work item
        run: |
          gh issue comment 26 --repo "${GITHUB_REPOSITORY}" --body "ADP-013 was certified against the exact clean merge tree and integrated through PR #27. The certification ran strict TypeScript/tests, runtime image build, all ten PostgreSQL migrations with idempotent rerun, every prior lifecycle, and the local-Git repository workspace isolation/scope lifecycle. Permanent global AI_DISPATCH and AUTOMATED_WRITE remain disabled."
          gh issue close 26 --repo "${GITHUB_REPOSITORY}" --reason completed

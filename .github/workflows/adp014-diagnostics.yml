name: ADP-014 Diagnostics

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.head_ref == 'change/ADP-014-bounded-workspace-commands'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: autodev
          POSTGRES_USER: autodev
          POSTGRES_PASSWORD: autodev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autodev -d autodev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://autodev:autodev@127.0.0.1:5432/autodev
      INTERNAL_API_TOKEN: ci-internal-token-not-for-production
      FOUNDER_API_TOKEN: ci-founder-token-not-for-production
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
      - name: Set up exact Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install committed locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build candidate
        run: npm run build
      - name: Apply migrations
        run: npm run migrate
      - name: Capture ADP-014 verifier output
        id: verify
        run: |
          set -o pipefail
          npm run verify:workspace-command 2>&1 | tee adp014-verifier.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adp014-verifier-diagnostics
          path: adp014-verifier.log
          retention-days: 1
